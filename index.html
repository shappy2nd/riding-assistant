<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17392b" />
  <title>라이딩 비서</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="brandBtn" class="brand" aria-label="오늘로 이동">🚴 라이딩 비서</button>
      <div class="top-actions"><span id="clock"></span><button id="stravaStatus" class="pill">Strava</button></div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button data-tab="today" class="active">오늘</button>
      <button data-tab="courses">코스</button>
      <button data-tab="ride">주행</button>
      <button data-tab="records">기록</button>
      <button data-tab="settings">설정</button>
    </nav>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
